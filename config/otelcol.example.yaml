receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 128

exporters:
  beaconjson:
    path: "~/.beacon/endpoint/logs/runtime.jsonl"
    max_event_bytes: 65536
    rotate_bytes: 10485760
    rotate_archives: 5
    redact_secrets: true

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

service:
  telemetry:
    metrics:
      level: none
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [beaconjson]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [beaconjson]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [beaconjson]
